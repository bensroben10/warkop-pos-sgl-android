name: Build Warkop POS SGL Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_FILE: /tmp/warkop-pos-sgl-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
          cache-provider: basic

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"

      - name: Verify release keystore
        run: |
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"

      - name: Build signed Release APK
        run: |
          gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Calculate APK SHA-256
        run: |
          sha256sum app/build/outputs/apk/release/app-release.apk \
            > app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WARKOP_POS_SGL-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30